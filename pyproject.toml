[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saline-dbs"
version = "0.1.0"
description = "SALINE: filter-based localization and segmentation of DBS electrodes in clinical MRI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "nibabel",
    "scipy",
    "scikit-image",
    "scikit-learn",
]

[project.scripts]
saline = "saline.cli:main"

[tool.setuptools.packages.find]
include = ["saline*"]
